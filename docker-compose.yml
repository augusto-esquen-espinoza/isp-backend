services:
  db:
    image: postgres:16-alpine
    container_name: isp-customers-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: isp_customers
      POSTGRES_USER: isp_user
      POSTGRES_PASSWORD: isp_pass
    ports:
      - "5432:5432"
    volumes:
      - isp-customers-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_customers"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: isp-customers-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/isp_customers
      DB_USER: isp_user
      DB_PASSWORD: isp_pass
    ports:
      - "8080:8080"

  # Runs only the database migrations without restarting the API.
  # Usage: docker compose --profile tools run --rm migrate
  # Other Flyway goals:
  #   docker compose --profile tools run --rm migrate mvn -B flyway:info \
  #     -Ddb.url=jdbc:postgresql://db:5432/isp_customers
  migrate:
    image: maven:3.9-eclipse-temurin-17
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - isp-maven-repo:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    command:
      - mvn
      - -B
      - -ntp
      - flyway:migrate
      - -Ddb.url=jdbc:postgresql://db:5432/isp_customers
      - -Ddb.user=isp_user
      - -Ddb.password=isp_pass

volumes:
  isp-customers-data:
  isp-maven-repo:

